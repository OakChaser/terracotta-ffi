name: Conic Terracotta Release

on:
  push:
    branches:
      - master
      - ci-test

permissions:
  contents: write

jobs:
  get-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.text }}
      sha: ${{ steps.sha.outputs.text }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Get version
        id: version
        run: |
          echo "text=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" >> "$GITHUB_OUTPUT"

      - name: Get commit
        id: sha
        run: |
          echo "text=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"


  build:
    needs: get-version

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            arch: arm64
            target: aarch64-apple-darwin

          - platform: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin

          - platform: ubuntu-22.04
            arch: x64
            target: x86_64-unknown-linux-gnu

          - platform: ubuntu-22.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu

          - platform: windows-2025
            arch: x64
            target: x86_64-pc-windows-msvc

          - platform: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package library
        shell: bash
        run: |
          mkdir release

          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/*.dll release/conic_terracotta_${{ matrix.target }}.dll
          elif [[ "${{ matrix.target }}" == *apple* ]]; then
            cp target/${{ matrix.target }}/release/*.dylib release/libconic_terracotta_${{ matrix.target }}.dylib
          else
            cp target/${{ matrix.target }}/release/*.so release/libconic_terracotta_${{ matrix.target }}.so
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: conic-terracotta-${{ matrix.arch }}-${{ matrix.platform }}
          path: release/


  release:
    needs:
      - build
      - get-version

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v${{ needs.get-version.outputs.version }}-${{ needs.get-version.outputs.sha }}

          gh release create "$TAG" --title "Conic Terracotta $TAG" --generate-notes

          find release_files -type f -print0 | while IFS= read -r -d '' file; do
            gh release upload "$TAG" "$file"
          done
